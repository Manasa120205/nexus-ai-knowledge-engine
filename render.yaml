services:
  - type: web
    name: nexus-ai-engine
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: NEXUS — AI Knowledge Retrieval & Research Engine
      - key: CORS_ORIGINS
        value: '["*"]'
